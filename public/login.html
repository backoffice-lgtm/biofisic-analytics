<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07100c">
  <title>Login · BioFisic Analytics</title>
  <style>
    :root {
      color-scheme: dark;
      --bio-green: #00f529;
      --bio-green-dark: #00b928;
      --ink: #f7fbf8;
      --muted: #aeb9b2;
      --panel: rgba(10, 14, 14, .88);
      --line: rgba(255, 255, 255, .15);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background: #07100c url("/assets/login-unit-lorena.jpeg") center center / cover no-repeat fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 245, 41, .08), transparent 38%),
        linear-gradient(110deg, rgba(2, 7, 7, .76), rgba(5, 8, 9, .55) 52%, rgba(3, 6, 8, .72));
      backdrop-filter: blur(2px) saturate(.72);
    }
    .login-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 18px;
    }
    .login-card {
      width: min(100%, 410px);
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(16, 20, 20, .94), var(--panel));
      box-shadow: 0 28px 80px rgba(0, 0, 0, .55), inset 0 1px rgba(255, 255, 255, .05);
      backdrop-filter: blur(18px);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 30px;
      letter-spacing: -.04em;
    }
    .brand strong { color: var(--bio-green); font-size: 23px; font-weight: 900; }
    .brand em { color: #fff; font-size: 23px; font-weight: 400; }
    .unit-tag {
      display: inline-flex;
      margin-bottom: 13px;
      padding: 5px 9px;
      border: 1px solid rgba(0, 245, 41, .28);
      border-radius: 999px;
      color: #8cff9f;
      background: rgba(0, 245, 41, .08);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 38px); line-height: 1; letter-spacing: -.04em; }
    .intro { margin: 11px 0 27px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .field { display: grid; gap: 8px; margin-top: 15px; }
    label { color: #dce4df; font-size: 12px; font-weight: 750; }
    input {
      width: 100%;
      min-height: 50px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: #fff;
      background: rgba(2, 5, 6, .62);
      font: inherit;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    input::placeholder { color: #748079; }
    input:focus {
      border-color: rgba(0, 245, 41, .72);
      background: rgba(2, 8, 5, .78);
      box-shadow: 0 0 0 3px rgba(0, 245, 41, .11);
    }
    button {
      width: 100%;
      min-height: 50px;
      margin-top: 22px;
      border: 0;
      border-radius: 11px;
      color: #041007;
      background: linear-gradient(100deg, #7bd60e, var(--bio-green-dark));
      box-shadow: 0 12px 26px rgba(0, 245, 41, .16);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease, opacity .18s ease;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { cursor: wait; opacity: .68; transform: none; }
    .message {
      min-height: 20px;
      margin: 13px 0 0;
      color: #ff8090;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, .09);
      color: #87948c;
      font-size: 10px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .security-note::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bio-green);
      box-shadow: 0 0 12px var(--bio-green);
    }
    @media (max-width: 560px) {
      body { background-position: 58% center; }
      .login-shell { align-items: end; padding: 22px 14px; }
      .login-card { padding: 27px 22px; border-radius: 18px; }
      .brand { margin-bottom: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand" aria-label="BioFisic Analytics"><strong>BIOFISIC</strong><em>ANALYTICS</em></div>
      <span class="unit-tag">Unidade Lorena</span>
      <h1 id="login-title">Login</h1>
      <p class="intro">Insira suas credenciais para acessar o painel de indicadores.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="user">Usuário</label>
          <input id="user" name="user" type="text" autocomplete="username" placeholder="Digite seu usuário" required autofocus>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
        </div>
        <button id="submitButton" type="submit">Entrar</button>
        <p id="message" class="message" role="alert" aria-live="polite"></p>
      </form>
      <div class="security-note">Acesso protegido · BioFisic Analytics</div>
    </section>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const requestedNext = new URLSearchParams(window.location.search).get("next");
    const next = requestedNext && requestedNext.startsWith("/") && !requestedNext.startsWith("//") && !requestedNext.startsWith("/login.html") ? requestedNext : "/";

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";
      if (!form.reportValidity()) return;
      button.disabled = true;
      button.textContent = "Entrando...";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            user: document.getElementById("user").value.trim(),
            password: document.getElementById("password").value,
            next,
          }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || "Não foi possível entrar.");
        window.location.replace(payload.redirect || next);
      } catch (error) {
        message.textContent = error.message || "Não foi possível entrar.";
        document.getElementById("password").select();
      } finally {
        button.disabled = false;
        button.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
