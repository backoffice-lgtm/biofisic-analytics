[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "auth"
  path = "/*"

[[redirects]]
  from = "/api/render-tab"
  to = "/.netlify/functions/render-tab"
  status = 200
  force = true

[[redirects]]
  from = "/api/export-xlsx"
  to = "/.netlify/functions/export-xlsx"
  status = 200
  force = true

[[redirects]]
  from = "/api/ask-isaias"
  to = "/.netlify/functions/ask-isaias"
  status = 200
  force = true

[[redirects]]
  from = "/api/supabase/sync"
  to = "/.netlify/functions/sync"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard_vendas_mar_abr_mai_2026.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
